name: Build and Release

on:
  release:
    types:
      - created  # Trigger when a new release is created

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64   # only build darwin/amd64 on ubuntu runner
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20

      - name: Build, package, and checksum
        run: |
          mkdir -p dist
          ext=""
          archive_ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
            archive_ext=".zip"
          else
            archive_ext=".tar.gz"
          fi

          binary_name="devmux-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          archive_name="devmux-${{ matrix.goos }}-${{ matrix.goarch }}${archive_ext}"

          echo "Building $binary_name"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/$binary_name

          # Package binary
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
          zip "$archive_name" "$binary_name"
          else
          tar czf "$archive_name" "$binary_name"
          fi

          # Generate SHA256 checksum
          shasum -a 256 "$archive_name" > "$archive_name.sha256"
          cd ..

      - name: Upload packaged binary to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/devmux-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
          asset_name: devmux-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip' || '.tar.gz' }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksum file to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/devmux-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip.sha256' || '.tar.gz.sha256' }}
          asset_name: devmux-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.zip.sha256' || '.tar.gz.sha256' }}
          asset_content_type: text/plain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
